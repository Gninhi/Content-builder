name: ContentOps CI Hardened Pipeline

on:
  push:
    branches: [ "main", "fix/*", "audit/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-style:
    name: Lint & Style Checks (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting & Type Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-requests types-PyYAML

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Mypy Type Checker
        run: |
          mypy packages/cache packages/observability packages/security packages/connectors tests/unit/

  test-suite:
    name: Automated Tests & Coverage (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov

      - name: Run Pytest with Coverage
        run: |
          pytest -v --cov=packages --cov=services --cov=apps --cov-report=term-missing

  security-audit:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan Secrets in Repository & History
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Audit Dependencies for Known Vulnerabilities (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --desc auto || echo "Audit complete - review any non-critical advisory"

  docker-build:
    name: Container Build & Healthcheck Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hardened Docker Image
        run: |
          docker build -f infra/docker/Dockerfile.api -t contentops-api:ci .
