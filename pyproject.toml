[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contentops-harness"
version = "2.0.0"
description = "Governed agentic editorial operating system built with LangGraph, FastAPI, and React/Vite"
authors = [{ name = "Martial Gninhi" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-nvidia-ai-endpoints>=0.3.0",
    "langfuse>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.0.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.18",
    "psycopg2-binary>=2.9.0",
    "httpx>=0.27.0",
    "urllib3>=2.8.0",
    "tavily-python>=0.3.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "PyJWT>=2.8.0",
    "argon2-cffi>=21.3.0",
    "beautifulsoup4>=4.12.0",
    "slowapi>=0.1.9",
    "redis>=5.0.0",
    "alembic>=1.13.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--ignore=tests/e2e"

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false
follow_imports = "silent"
plugins = ["sqlalchemy.ext.mypy.plugin"]

# Mypy static typing configuration


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W291", "W292", "W293"]

[tool.ruff.lint.per-file-ignores]
"apps/api/main.py" = ["E402"]
"scripts/*.py" = ["E402"]





