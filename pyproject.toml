[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contentops-harness"
version = "1.0.0"
description = "Governed agentic editorial operating system built with LangGraph, FastAPI, and React/Vite"
authors = [{ name = "Martial Gninhi" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai==4.4.0",
    "langchain-nvidia-ai-endpoints>=1.4.2",
    "langfuse==4.17.0",
    "langsmith>=0.8.18",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "httpx>=0.27.0",
    "urllib3>=2.8.0",
    "tavily-python>=0.3.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "PyJWT>=2.8.0",
    "slowapi>=0.1.9",
    "redis>=5.0.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--ignore=tests/e2e"

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false
follow_imports = "silent"

[[tool.mypy.overrides]]
module = [
    "infra.db.*",
    "services.orchestration.*",
    "packages.tools.*",
    "apps.api.routers.*",
    "tests.audit.*",
    "tests.unit.*"
]
ignore_errors = true


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W291", "W292", "W293"]

[tool.ruff.lint.per-file-ignores]
"apps/api/main.py" = ["E402"]
"scripts/*.py" = ["E402"]





