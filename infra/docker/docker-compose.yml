version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: contentops_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: contentops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
      - ../migrations/002_rls_policies.sql:/docker-entrypoint-initdb.d/002_rls_policies.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: contentops_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redisdata:/data

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: contentops_api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/contentops
      REDIS_URL: redis://redis:6379/0
      ENV: production
      ENVIRONMENT: production
      SOCIAL_SANDBOX_MODE: "true"
      LIVE_PUBLISHING_ENABLED: "false"
    volumes:
      - ../../storage:/app/storage

volumes:
  pgdata:
  redisdata:

